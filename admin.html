<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Jean Global Opportunities</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172b4d}
header{background:#071b35;color:white;padding:20px;text-align:center}
.container{max-width:850px;margin:25px auto;padding:15px}
.box{background:white;padding:22px;border-radius:12px;margin-bottom:20px;box-shadow:0 3px 12px #0001}
h2{color:#071b35}
input,select,textarea{width:100%;padding:13px;margin:8px 0 15px;border:1px solid #ccc;border-radius:7px;font-size:15px}
textarea{min-height:90px}
button{padding:12px 18px;border:0;border-radius:7px;background:#0878d1;color:white;font-size:15px;cursor:pointer;margin:4px}
button.danger{background:#c62828}
button.secondary{background:#526579}
.card{border:1px solid #ddd;padding:15px;border-radius:9px;margin:12px 0}
.hidden{display:none}
#message{padding:10px;border-radius:7px;margin:10px 0}
footer{text-align:center;padding:20px;color:#666}
</style>
</head>

<body>

<header>
<h1>JEAN GLOBAL OPPORTUNITIES</h1>
<p>Administrator Dashboard</p>
</header>

<div class="container">

<div class="box" id="loginBox">
<h2>🔐 Admin Login</h2>

<form id="loginForm">
<label>Email</label>
<input type="email" id="email" required
placeholder="Your admin email">

<label>Password</label>
<input type="password" id="password" required
placeholder="Your password">

<button type="submit">Login</button>
</form>
<div id="loginMessage"></div>
</div>

<div id="dashboard" class="hidden">

<div class="box">
<h2>👑 Welcome Admin</h2>
<p>You can manage all opportunities here.</p>
<button onclick="logout()" class="danger">Logout</button>
</div>

<div class="box">
<h2 id="formTitle">➕ Add New Opportunity</h2>

<form id="opportunityForm">

<input type="hidden" id="editId">

<label>Opportunity Title</label>
<input id="title" required placeholder="Enter title">

<label>Category</label>
<select id="category" required>
<option value="">Choose category</option>
<option>Jobs</option>
<option>Scholarships</option>
<option>UN Opportunities</option>
<option>Youth Programmes</option>
<option>Conferences</option>
<option>Training</option>
</select>

<label>Country</label>
<input id="country" placeholder="Country">

<label>Description</label>
<textarea id="description" required></textarea>

<label>Eligibility</label>
<textarea id="eligibility"></textarea>

<label>Deadline</label>
<input type="date" id="deadline">

<label>Application Link</label>
<input type="url" id="apply_url" placeholder="https://">

<label>Official Source Link</label>
<input type="url" id="source_url" placeholder="https://">

<label>Publication Status</label>
<select id="status">
<option value="published">Published</option>
<option value="draft">Draft</option>
</select>

<button type="submit" id="saveButton">Publish Opportunity</button>
<button type="button" class="secondary hidden" id="cancelEdit" onclick="resetForm()">Cancel Edit</button>

</form>

<div id="formMessage"></div>
</div>

<div class="box">
<h2>📋 Manage Opportunities</h2>
<button onclick="loadOpportunities()">Refresh List</button>
<div id="opportunitiesList">Loading...</div>
</div>

</div>
</div>

<footer>
© 2026 Jean Global Opportunities
</footer>

<script>
const SUPABASE_URL = "https://bfhftrnekepumldknfpy.supabase.co";

const SUPABASE_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");

function message(id,text){
document.getElementById(id).textContent=text;
}

async function checkAdmin(){
const {data:{session}} = await db.auth.getSession();

if(!session){
loginBox.classList.remove("hidden");
dashboard.classList.add("hidden");
return;
}

const {data,error} = await db.rpc("is_site_admin");

if(error || data !== true){
await db.auth.signOut();
message("loginMessage","This account is not authorized as administrator.");
return;
}

loginBox.classList.add("hidden");
dashboard.classList.remove("hidden");

loadOpportunities();
}

document.getElementById("loginForm").addEventListener("submit",async e=>{
e.preventDefault();

message("loginMessage","Checking login...");

const {error} = await db.auth.signInWithPassword({
email:document.getElementById("email").value,
password:document.getElementById("password").value
});

if(error){
message("loginMessage","Login failed: "+error.message);
return;
}

await checkAdmin();
});

async function logout(){
await db.auth.signOut();
location.reload();
}

async function loadOpportunities(){

const list=document.getElementById("opportunitiesList");
list.textContent="Loading opportunities...";

const {data,error}=await db
.from("opportunities")
.select("*")
.order("created_at",{ascending:false});

if(error){
list.textContent="Error loading opportunities: "+error.message;
return;
}

list.innerHTML="";

if(!data.length){
list.textContent="No opportunities found.";
return;
}

data.forEach(item=>{

const card=document.createElement("div");
card.className="card";

const title=document.createElement("h3");
title.textContent=item.title;

const details=document.createElement("p");
details.textContent=item.category+" | "+(item.country||"");

const status=document.createElement("p");
status.textContent="Status: "+item.status;

const edit=document.createElement("button");
edit.textContent="Edit";
edit.onclick=()=>editOpportunity(item);

const del=document.createElement("button");
del.textContent="Delete";
del.className="danger";
del.onclick=()=>deleteOpportunity(item.id);

card.append(title,details,status,edit,del);
list.appendChild(card);

});
}

document.getElementById("opportunityForm").addEventListener("submit",async e=>{

e.preventDefault();

const id=document.getElementById("editId").value;

const opportunity={
title:document.getElementById("title").value.trim(),
category:document.getElementById("category").value,
country:document.getElementById("country").value.trim(),
description:document.getElementById("description").value.trim(),
eligibility:document.getElementById("eligibility").value.trim(),
deadline:document.getElementById("deadline").value||null,
apply_url:document.getElementById("apply_url").value.trim()||null,
source_url:document.getElementById("source_url").value.trim()||null,
status:document.getElementById("status").value
};

message("formMessage","Saving...");

let result;

if(id){
result=await db.from("opportunities").update(opportunity).eq("id",id);
}else{
result=await db.from("opportunities").insert(opportunity);
}

if(result.error){
message("formMessage","Error: "+result.error.message);
return;
}

message("formMessage","Opportunity saved successfully!");

resetForm();
loadOpportunities();

});

function editOpportunity(item){

document.getElementById("editId").value=item.id;
document.getElementById("title").value=item.title;
document.getElementById("category").value=item.category;
document.getElementById("country").value=item.country||"";
document.getElementById("description").value=item.description||"";
document.getElementById("eligibility").value=item.eligibility||"";
document.getElementById("deadline").value=item.deadline||"";
document.getElementById("apply_url").value=item.apply_url||"";
document.getElementById("source_url").value=item.source_url||"";
document.getElementById("status").value=item.status||"published";

document.getElementById("formTitle").textContent="✏️ Edit Opportunity";
document.getElementById("saveButton").textContent="Update Opportunity";
document.getElementById("cancelEdit").classList.remove("hidden");

window.scrollTo(0,0);
}

function resetForm(){

document.getElementById("opportunityForm").reset();
document.getElementById("editId").value="";
document.getElementById("formTitle").textContent="➕ Add New Opportunity";
document.getElementById("saveButton").textContent="Publish Opportunity";
document.getElementById("cancelEdit").classList.add("hidden");

}

async function deleteOpportunity(id){

if(!confirm("Are you sure you want to delete this opportunity?"))return;

const {error}=await db.from("opportunities").delete().eq("id",id);

if(error){
alert("Delete failed: "+error.message);
return;
}

alert("Opportunity deleted successfully!");
loadOpportunities();

}

checkAdmin();

</script>
</body>
</html>
